# docs/Conductor/templates/VERIFICATION_MANIFEST_TEMPLATE.yaml
#
# Create at: docs/Conductor/runs/<RUN_ID>/pack/verification_manifest.yaml
# Purpose: machine-readable verification contract for EXECUTION_ENABLED and
# Mission Mode runs. Mandatory whenever verification_plan.md declares runnable
# VM checks: the canonical execution closeout cannot be recorded without it and
# pack-lint fails an execution-enabled run that lacks it. Only packs with no
# runnable VM inventory may omit it (planning-only packs stay lightweight).
# `execution_mode` records the mode of the pack audited at I2. It remains
# unchanged if a later digest-bound authorization activates execution.
# Check IDs must exactly match the dedicated verification_plan.md `## Checks`
# inventory and IDs referenced by traceability coverage cells.
# Pack-lint validates the preimage manifest and its pin. The command performs
# target-byte comparison at the lifecycle point declared by the verification plan.
# When execution_order is present, it is authoritative. It must contain every
# VM check exactly once; named non-VM operations may be interposed explicitly.

schema_version: 1
run_id: RUN_YYYYMMDD_HHMM_TAG
sprint_id: SPRINT_YYYYMMDD_NNN
execution_mode: EXECUTION_ENABLED
execution_order: [VM-001, VM-002]

checks:
  - id: VM-001
    tier: V2
    type: test
    constraint_ids:
      - C-001
    description: Replace with the invariant this check proves.
    command: python3 -m unittest tests.test_example -v
    expected: Command exits 0 and covers the named constraint directly.
    halt_on_failure: true
    evidence_path: artifacts/verification/example_output.txt

  - id: VM-002
    tier: V1
    type: no_touch
    constraint_ids:
      - C-002
    description: Prove forbidden paths were not changed.
    command: git diff --name-only -- forbidden/path
    expected: Command prints no changed files.
    halt_on_failure: true
    preimage_manifest: pack/fixtures/no_touch_preimages.json
    preimage_manifest_sha256: 64_lowercase_hex_characters
    evidence_path: artifacts/verification/no_touch.txt
